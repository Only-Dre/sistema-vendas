spring.application.name=sistema-vendas

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sistema_vendas}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Render termina o HTTPS no proxy; respeita X-Forwarded-* para gerar redirects corretos
server.forward-headers-strategy=native

# Usuarios de teste criados na primeira inicializacao (sobrescreva por variavel de ambiente)
app.seed.admin.nome=${SEED_ADMIN_NOME:Administrador}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@sistemavendas.com}
app.seed.admin.senha=${SEED_ADMIN_SENHA:Admin@123}
app.seed.padrao.nome=${SEED_PADRAO_NOME:Usuario Padrao}
app.seed.padrao.email=${SEED_PADRAO_EMAIL:padrao@sistemavendas.com}
app.seed.padrao.senha=${SEED_PADRAO_SENHA:Padrao@123}
