<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark" sec:authorize="isAuthenticated()">
    <div class="container">
        <a class="navbar-brand" th:href="@{/pedidos}">Sistema de Vendas</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Pedidos: ADMIN e PADRAO -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pedidos}">Pedidos</a>
                </li>
                <!-- Clientes e Produtos: somente ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                </li>
            </ul>

            <span class="navbar-text me-3">
                <span sec:authentication="principal.nome">Usuário</span>
                <span class="badge bg-secondary" sec:authentication="principal.role">PERFIL</span>
            </span>

            <!-- Leva à página logout.html (o POST /logout fica dentro dela) -->
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>

</body>
</html>
